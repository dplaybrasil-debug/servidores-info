<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Preview da Animação - Logo CS</title>
    <style>
        body { 
            background: #02040a; /* Fundo super escuro */
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            font-family: sans-serif;
            overflow: hidden;
        }
        
        .logo-container {
            position: relative;
            /* Animação de flutuação suave */
            animation: float 4s ease-in-out infinite;
        }

        .logo-img {
            max-width: 400px;
            border-radius: 24px;
            /* Sombra neon ciano de base */
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.1);
            /* Animação de pulsação de luz neon */
            animation: neon-pulse 2s infinite alternate;
        }

        /* Efeito de Reflexo no chão (opcional, dá um toque premium) */
        .logo-container::after {
            content: '';
            position: absolute;
            bottom: -30px;
            left: 10%;
            width: 80%;
            height: 20px;
            background: radial-gradient(ellipse at center, rgba(0, 255, 255, 0.4) 0%, transparent 70%);
            filter: blur(10px);
            animation: shadow-pulse 4s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }

        @keyframes shadow-pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(0.8); opacity: 0.3; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        @keyframes neon-pulse {
            from { 
                filter: drop-shadow(0 0 10px rgba(0, 255, 255, 0.4)) brightness(1); 
            }
            to { 
                filter: drop-shadow(0 0 30px rgba(0, 255, 255, 0.8)) brightness(1.25); 
            }
        }
        
        .aviso {
            position: absolute;
            top: 20px;
            color: rgba(255,255,255,0.5);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="aviso">Simulação de Animação via Código (CSS)</div>
    <div class="logo-container">
        <!-- O caminho da imagem gerada no seu computador -->
        <img src="C:/Users/dimil/.gemini/antigravity/brain/83bea449-cc84-4746-9ccb-91362fda3577/logo_8_typography_1783359062886.png" class="logo-img">
    </div>
</body>
</html>
