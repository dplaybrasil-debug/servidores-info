<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Servidores — Portal</title>
    <meta name="description" content="Portal Central de Servidores: acesse servidores, apps parceiros e suporte.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Proteção contra cópias */
        * {
            user-select: none !important;
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
        }
        
        input, textarea {
            user-select: text !important;
            -webkit-user-select: text !important;
            -moz-user-select: text !important;
            -ms-user-select: text !important;
        }

        img {
            -webkit-user-drag: none !important;
            user-drag: none !important;
        }

        /* =====================================================
           PORTAL LAYOUT
           ===================================================== */
        .portal-layout {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* =====================================================
           HEADER
           ===================================================== */
        .portal-header {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 0.6rem 2rem;
            background: rgba(8, 12, 20, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(124, 58, 237, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 1px 0 rgba(124,58,237,0.1), 0 4px 30px rgba(0,0,0,0.4);
            transition: border-color 0.3s;
        }

        .portal-header::after {
            content: '';
            position: absolute;
            bottom: 0; left: 5%; right: 5%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(124,58,237,0.5), rgba(6,182,212,0.5), transparent);
            opacity: 0.7;
        }

        /* --- Logo --- */
        .portal-logo {
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        .portal-logo img {
            height: 38px;
            width: auto;
            filter: drop-shadow(0 0 10px rgba(6,182,212,0.55)) drop-shadow(0 0 4px rgba(124,58,237,0.4));
            transition: filter 0.3s;
        }

        .portal-logo img:hover {
            filter: drop-shadow(0 0 18px rgba(6,182,212,0.9)) drop-shadow(0 0 8px rgba(124,58,237,0.6));
        }

        /* --- Nav --- */
        .portal-nav {
            display: flex;
            gap: 0.25rem;
            align-items: center;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 50px;
            padding: 4px;
        }

        .portal-nav button {
            background: transparent;
            color: var(--text-muted);
            border: none;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            padding: 0.45rem 1rem;
            border-radius: 50px;
            transition: all 0.3s var(--ease-smooth);
            white-space: nowrap;
            letter-spacing: 0.02em;
        }

        .portal-nav button:hover {
            color: white;
            background: rgba(255,255,255,0.07);
        }

        .portal-nav button.active {
            color: white;
            background: linear-gradient(135deg, var(--primary) 0%, rgba(6,182,212,0.85) 100%);
            box-shadow: 0 3px 12px rgba(124,58,237,0.45), 0 1px 3px rgba(0,0,0,0.3);
        }

        /* --- Search --- */
        .portal-header-search {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding-right: 0.2rem;
        }

        .search-inline-container {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 50px;
            padding: 2px;
            transition: all 0.3s var(--ease-smooth);
        }

        .search-inline-container.active {
            background: rgba(0, 0, 0, 0.45);
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(124,58,237,0.25);
        }

        .search-trigger-btn {
            background: transparent;
            border: none;
            color: rgba(255,255,255,0.55);
            cursor: pointer;
            width: 32px; height: 32px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s;
        }

        .search-trigger-btn:hover { color: white; background: rgba(255,255,255,0.08); }
        .search-inline-container.active .search-trigger-btn { color: var(--cyan); }

        .search-inline-wrapper {
            width: 0; opacity: 0; overflow: hidden;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; align-items: center;
        }

        .search-inline-container.active .search-inline-wrapper {
            width: 190px; opacity: 1; padding-right: 0.5rem;
        }

        .search-inline-container input {
            background: transparent;
            border: none;
            color: white;
            font-size: 0.84rem;
            width: 100%;
            outline: none;
            padding: 0.3rem 0.5rem;
        }

        .search-inline-container input::placeholder { color: rgba(255,255,255,0.3); }

        /* =====================================================
           PORTAL CONTENT
           ===================================================== */
        .portal-content {
            padding: 2rem;
            flex: 1;
            min-height: 0;
            max-width: 1440px;
            margin: 0 auto;
            width: 100%;
            overflow-y: auto;
        }

        /* =====================================================
           FILTER PILLS
           ===================================================== */
        #publicServerFilterBar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.55rem;
            justify-content: center;
            margin-bottom: 1.8rem;
        }

        .filter-pill {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.42rem 1.1rem;
            border-radius: 50px;
            border: 1.5px solid transparent;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.03em;
            transition: all 0.25s var(--ease-smooth);
            position: relative;
        }

        .filter-pill:hover { transform: translateY(-2px); }

        .filter-pill .pill-count {
            font-size: 0.72rem;
            padding: 1px 7px;
            border-radius: 50px;
            font-weight: 700;
            background: rgba(255,255,255,0.15);
            transition: background 0.2s;
        }

        /* Variantes de cor */
        .pill-all {
            background: rgba(255,255,255,0.07);
            color: rgba(255,255,255,0.85);
            border-color: rgba(255,255,255,0.2);
        }
        .pill-all.active, .pill-all:hover {
            background: rgba(255,255,255,0.14);
            border-color: rgba(255,255,255,0.5);
            color: white;
            box-shadow: 0 4px 14px rgba(255,255,255,0.1);
        }

        .pill-hybrid {
            background: rgba(251,191,36,0.1);
            color: #fde68a;
            border-color: rgba(251,191,36,0.25);
        }
        .pill-hybrid.active, .pill-hybrid:hover {
            background: rgba(251,191,36,0.2);
            border-color: rgba(251,191,36,0.6);
            box-shadow: 0 4px 14px rgba(251,191,36,0.2);
        }

        .pill-iptv {
            background: rgba(124,58,237,0.12);
            color: #c4b5fd;
            border-color: rgba(124,58,237,0.3);
        }
        .pill-iptv.active, .pill-iptv:hover {
            background: rgba(124,58,237,0.22);
            border-color: rgba(124,58,237,0.6);
            box-shadow: 0 4px 14px rgba(124,58,237,0.25);
        }

        .pill-android {
            background: rgba(52,211,153,0.1);
            color: #6ee7b7;
            border-color: rgba(52,211,153,0.25);
        }
        .pill-android.active, .pill-android:hover {
            background: rgba(52,211,153,0.2);
            border-color: rgba(52,211,153,0.55);
            box-shadow: 0 4px 14px rgba(52,211,153,0.2);
        }

        .pill-screens {
            background: rgba(6,182,212,0.1);
            color: #67e8f9;
            border-color: rgba(6,182,212,0.25);
        }
        .pill-screens.active, .pill-screens:hover {
            background: rgba(6,182,212,0.2);
            border-color: rgba(6,182,212,0.55);
            box-shadow: 0 4px 14px rgba(6,182,212,0.2);
        }

        /* =====================================================
           SECTION SUPPORT — Central de Ajuda
           ===================================================== */
        #section-support {
            display: none;
            padding: 2rem 0;
        }

        .support-hero {
            text-align: center;
            margin-bottom: 3.5rem;
        }

        .support-hero h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 900;
            color: white;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            margin: 0 0 0.75rem;
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(270deg, #7c3aed, #06b6d4, #a855f7, #22d3ee);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 5s ease infinite;
        }

        .support-hero p {
            color: var(--text-muted);
            font-size: 1rem;
            max-width: 500px;
            margin: 0 auto;
        }

        /* =====================================================
           MODAL DE INFORMAÇÕES (Info)
           ===================================================== */
        .info-stats {
            display: flex;
            gap: 0.75rem;
            margin-top: 1.25rem;
        }

        .stat-item {
            flex: 1;
            text-align: center;
            background: rgba(124,58,237,0.08);
            border: 1px solid rgba(124,58,237,0.2);
            padding: 1rem 0.5rem;
            border-radius: var(--radius-md);
            transition: all 0.25s;
        }

        .stat-item:hover {
            background: rgba(124,58,237,0.15);
            border-color: rgba(124,58,237,0.4);
            transform: translateY(-2px);
        }

        .stat-item h4 {
            margin: 0 0 0.4rem;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .stat-item span {
            font-size: 1.6rem;
            font-weight: 800;
            background: var(--grad-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-family: 'Outfit', sans-serif;
        }

        /* --- Botão Acessar no Modal --- */
        .btn-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: var(--grad-primary);
            color: white;
            text-decoration: none;
            padding: 0.9rem 2rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.9rem;
            margin-top: 1.5rem;
            text-align: center;
            width: 100%;
            transition: all 0.3s var(--ease-smooth);
            box-shadow: 0 6px 20px rgba(124,58,237,0.35);
            letter-spacing: 0.04em;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }

        .btn-link::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.15) 50%, transparent 100%);
            transform: translateX(-100%);
            transition: transform 0.5s;
        }

        .btn-link:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(124,58,237,0.55), 0 0 20px rgba(6,182,212,0.2);
        }

        .btn-link:hover::before { transform: translateX(100%); }

        /* =====================================================
           RESPONSIVE
           ===================================================== */
        @media (max-width: 600px) {
            .portal-header {
                display: flex;
                flex-direction: column;
                gap: 0.75rem;
                padding: 0.75rem 1rem;
                align-items: center;
            }
            .portal-nav { width: 100%; justify-content: center; }
            .portal-nav button { font-size: 0.78rem; padding: 0.4rem 0.75rem; }
            .portal-header-search { justify-content: center !important; width: 100%; padding: 0; }
            .search-inline-container.active .search-inline-wrapper { width: 150px; }
            .portal-content { padding: 1rem; }
            .info-stats { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="portal-layout">
        <!-- Cabeçalho -->
        <header class="portal-header">
            <!-- Esquerda: Logo -->
            <div class="portal-logo">
                <img src="assets/logo-central-v2.png" alt="Central de Servidores">
            </div>
            
            <!-- Centro: Navegação -->
            <nav class="portal-nav">
                <button class="active" id="btnServidores" onclick="switchTab('servers')">Servidores</button>
                <button id="btnApps" onclick="switchTab('apps')">Apps Parceiros</button>
                <button id="btnApoio" onclick="switchTab('support')">📞 Apoio</button>
            </nav>
            
            <!-- Direita: Pesquisa -->
            <div class="portal-header-search">
                <div class="search-inline-container" id="searchInlineContainer">
                    <button class="search-trigger-btn" onclick="toggleSearch()" title="Pesquisar">
                        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="pointer-events:none"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    </button>
                    <div class="search-inline-wrapper">
                        <input type="text" id="searchInput" placeholder="Pesquisar...">
                    </div>
                </div>
            </div>
        </header>

        <!-- Conteúdo -->
        <main class="portal-content">

            <!-- Pills de filtro (visíveis só na aba Servidores) -->
            <div id="publicServerFilterBar">
                <button id="pubSrvFilterAll" class="filter-pill pill-all active" onclick="filterPublicServers('all')">
                    🔍 Todos <span id="pubSrvCnt-all" class="pill-count">0</span>
                </button>
                <button id="pubSrvFilterHybrid" class="filter-pill pill-hybrid" onclick="filterPublicServers('hybrid')">
                    🔀 Híbrido <span id="pubSrvCnt-hybrid" class="pill-count">0</span>
                </button>
                <button id="pubSrvFilterIptv" class="filter-pill pill-iptv" onclick="filterPublicServers('iptv')">
                    📡 IPTV <span id="pubSrvCnt-iptv" class="pill-count">0</span>
                </button>
                <button id="pubSrvFilterAndroid" class="filter-pill pill-android" onclick="filterPublicServers('android')">
                    🤖 Android <span id="pubSrvCnt-android" class="pill-count">0</span>
                </button>
                <button id="pubSrvFilterScreens" class="filter-pill pill-screens" onclick="filterPublicServers('screens')">
                    📺 Multi-tela <span id="pubSrvCnt-screens" class="pill-count">0</span>
                </button>
            </div>

            <div id="section-servers" style="display: block;">
                <div class="grid" id="publicServersGrid" style="grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 1.2rem;"></div>
            </div>

            <div id="section-apps" style="display: none;">
                <div class="grid" id="publicAppsGrid" style="grid-template-columns: repeat(auto-fill, minmax(125px, 1fr)); gap: 1rem;"></div>
            </div>

            <div id="section-support">
                <div class="support-hero">
                    <h1>Central de Ajuda</h1>
                    <p>Escolha um canal e nossa equipe vai te atender rapidinho.</p>
                </div>
                <div id="publicContactsGrid" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:1.8rem; max-width:1100px; margin:0 auto;"></div>
            </div>
        </main>
    </div>

    <!-- Popup de Atualização (Centralizado) -->
    <div id="updateToastBackdrop" style="
        position: fixed; inset: 0; z-index: 8999;
        background: rgba(0, 0, 0, 0.75);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        display: none;
    "></div>

    <div id="updateToast" style="
        position: fixed;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%) scale(0.92);
        z-index: 9000;
        width: min(520px, calc(100vw - 2rem));
        background: rgba(10, 14, 26, 0.98);
        border: 1.5px solid rgba(124, 58, 237, 0.55);
        border-radius: 28px;
        padding: 2.5rem 2rem 2rem;
        box-shadow: 0 30px 80px rgba(0,0,0,0.8), 0 0 60px rgba(124,58,237,0.25);
        backdrop-filter: blur(24px);
        display: none;
        flex-direction: column;
        gap: 1.2rem;
        animation: popInCenter 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    ">
        <!-- Barra superior gradiente -->
        <div style="position:absolute; top:0; left:0; right:0; height:4px; border-radius:28px 28px 0 0;
                    background: linear-gradient(90deg, #7c3aed, #06b6d4, #7c3aed);
                    background-size: 200% 100%;
                    animation: gradientShift 3s ease infinite;"></div>

        <!-- Ícone central grande -->
        <div style="text-align:center; margin-bottom:0.25rem;">
            <div style="font-size:3.5rem; line-height:1; margin-bottom:0.75rem;">🚀</div>
            <div style="font-size:1.5rem; font-weight:900; color:white; letter-spacing:0.02em;
                        font-family:'Outfit', sans-serif;">
                Atualização Disponível!
            </div>
            <div id="updateToastDate" style="font-size:0.85rem; color:var(--text-muted); margin-top:0.4rem;"></div>
        </div>

        <!-- Contadores centralizados -->
        <div id="updateToastStats" style="display:flex; gap:0.75rem; justify-content:center; flex-wrap:wrap;"></div>

        <!-- Divisor -->
        <div style="height:1px; background:linear-gradient(90deg,transparent,rgba(124,58,237,0.3),transparent);"></div>

        <!-- Mensagem -->
        <div style="font-size:0.92rem; color:var(--text-muted); line-height:1.6; text-align:center;">
            O conteúdo do portal foi atualizado com novidades.<br>
            Recarregue a página para ver tudo!
        </div>

        <!-- Botões -->
        <div style="display:flex; gap:0.75rem; margin-top:0.25rem;">
            <button onclick="location.reload()"
                    style="flex:1; padding:0.9rem; border-radius:50px; border:none; cursor:pointer;
                           background:linear-gradient(135deg,#7c3aed,#06b6d4); color:white;
                           font-size:0.95rem; font-weight:700; letter-spacing:0.04em;
                           box-shadow:0 6px 20px rgba(124,58,237,0.45); transition:all 0.25s;"
                    onmouseover="this.style.transform='translateY(-3px)'; this.style.boxShadow='0 12px 35px rgba(124,58,237,0.65)'"
                    onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 6px 20px rgba(124,58,237,0.45)'"
            >🔄 Atualizar agora</button>
            <button onclick="dismissUpdateToast()"
                    style="padding:0.9rem 1.5rem; border-radius:50px; cursor:pointer;
                           background:transparent; color:var(--text-muted);
                           border:1px solid rgba(255,255,255,0.12); font-size:0.95rem; transition:all 0.25s;"
                    onmouseover="this.style.borderColor='rgba(255,255,255,0.3)'; this.style.color='white'"
                    onmouseout="this.style.borderColor='rgba(255,255,255,0.12)'; this.style.color='var(--text-muted)'"
            >Depois</button>
        </div>

        <!-- Fechar (X) -->
        <button onclick="dismissUpdateToast()"
                style="position:absolute; top:1.2rem; right:1.2rem;
                       background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1);
                       color:rgba(255,255,255,0.5); font-size:1.1rem; cursor:pointer;
                       width:34px; height:34px; border-radius:50%;
                       display:flex; align-items:center; justify-content:center; transition:all 0.2s;"
                onmouseover="this.style.background='rgba(244,63,94,0.15)'; this.style.color='#fb7185'; this.style.borderColor='rgba(244,63,94,0.3)'"
                onmouseout="this.style.background='rgba(255,255,255,0.06)'; this.style.color='rgba(255,255,255,0.5)'; this.style.borderColor='rgba(255,255,255,0.1)'"
        >&times;</button>
    </div>

    <style>
        @keyframes popInCenter {
            from { opacity: 0; transform: translate(-50%, -50%) scale(0.85); }
            to   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
    </style>

    <!-- Modal de Informações -->
    <div class="modal-overlay" id="modalInfo">
        <div class="modal glass-panel" style="max-width: 880px; width: 95%;">
            <div class="modal-header">
                <h2 id="infoTitle">Detalhes</h2>
                <button class="close-btn" onclick="closeModal('modalInfo')">&times;</button>
            </div>
            <div style="text-align: center; margin-bottom: 1.25rem;">
                <img id="infoLogo" src="" referrerpolicy="no-referrer"
                     style="width: 110px; height: 110px; object-fit: cover; border-radius: 22px;
                            display: none; margin: 0 auto;
                            box-shadow: 0 12px 40px rgba(0,0,0,0.6), 0 0 30px rgba(124,58,237,0.25);
                            border: 2px solid rgba(124,58,237,0.25);">
            </div>
            <p id="infoDesc" style="color: var(--text-muted); text-align: center; margin-bottom: 1.5rem; max-width: 650px; margin-left: auto; margin-right: auto; line-height: 1.6;"></p>
            
            <div id="infoStatsContainer" class="info-stats" style="display: none;">
                <div class="stat-item">
                    <h4>Canais</h4>
                    <span id="infoChannels">0</span>
                </div>
                <div class="stat-item">
                    <h4>Filmes</h4>
                    <span id="infoMovies">0</span>
                </div>
                <div class="stat-item">
                    <h4>Séries</h4>
                    <span id="infoSeries">0</span>
                </div>
            </div>

            <!-- Servidores Compatíveis -->
            <div id="infoLinkedContainer" style="display: none; margin-top: 1.5rem; border-top: 1px solid var(--glass-border); padding-top: 1.5rem;">
                <h4 id="infoLinkedTitle" style="color: var(--text-muted); font-size: 1rem; font-weight: 600; margin-bottom: 1.25rem; text-align: center;"></h4>
                <div id="infoLinkedGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1rem;">
                    <!-- Servidores injetados via JS -->
                </div>
            </div>

            <a href="#" id="infoLink" class="btn-link" target="_blank" style="display: none;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                Acessar
            </a>
            <p id="noLinkMsg" style="text-align: center; color: var(--danger); display: none; margin-top: 1rem; font-size: 0.9rem;">Link não disponível</p>
        </div>
    </div>

    <!-- Marca d'água Repetida (Sobreposta para proteção) -->
    <div style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
                z-index: 9999; opacity: 0.06; pointer-events: none;
                background-image: url('assets/logo-central-v2.png');
                background-repeat: repeat; background-size: 220px;">
    </div>

    <script>
        function toggleSearch() {
            const container = document.getElementById('searchInlineContainer');
            const input = document.getElementById('searchInput');
            if (!container || !input) return;
            
            container.classList.toggle('active');
            if (container.classList.contains('active')) {
                setTimeout(() => input.focus(), 150);
            } else {
                input.value = '';
                input.dispatchEvent(new Event('input'));
            }
        }

        // Proteção contra cópias e inspeção de código
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('dragstart', e => {
            if (e.target.nodeName === 'IMG') e.preventDefault();
        });
        document.addEventListener('keydown', e => {
            if (
                (e.ctrlKey && (e.key === 'c' || e.key === 'u' || e.key === 'C' || e.key === 'U' || e.key === 'a' || e.key === 'A')) ||
                (e.ctrlKey && e.shiftKey && (e.key === 'i' || e.key === 'I' || e.key === 'j' || e.key === 'J' || e.key === 'c' || e.key === 'C')) ||
                e.key === 'F12'
            ) {
                e.preventDefault();
            }
        });
    </script>
    <script src="data.js?v=6"></script>
    <script src="portal.js?v=18"></script>
</body>
</html>
