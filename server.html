<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Redirecionando...</title>
    <script>
        const slugify = (text) => {
            return (text || '').toString()
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .toLowerCase()
                .replace(/\s+/g, '-')
                .replace(/[^\w\-]+/g, '')
                .replace(/\-\-+/g, '-')
                .replace(/^-+/, '')
                .replace(/-+$/, '');
        };
        const params = new URLSearchParams(window.location.search);
        const nome = params.get('nome');
        if (nome) {
            window.location.replace('index.html#Servidores/' + slugify(nome));
        } else {
            window.location.replace('index.html#Servidores');
        }
    </script>
</head>
<body style="background: #0a0e1a; color: white; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif;">
    Redirecionando...
</body>
</html>
